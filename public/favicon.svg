<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#059669"/>

  <!-- Base line -->
  <rect x="29" y="72" width="42" height="8" rx="4" fill="white"/>

  <!-- Stem -->
  <path d="M50 70 C50 58 44 52 40 42"
    stroke="white" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Left leaf outer (larger, tilted left) -->
  <ellipse cx="32" cy="46" rx="22" ry="13"
    transform="rotate(-35 32 46)" fill="white"/>
  <!-- Left leaf inner cutout -->
  <ellipse cx="32" cy="46" rx="13" ry="6.5"
    transform="rotate(-35 32 46)" fill="#059669"/>

  <!-- Right leaf outer (smaller, tilted right) -->
  <ellipse cx="63" cy="32" rx="17" ry="10"
    transform="rotate(30 63 32)" fill="white"/>
  <!-- Right leaf inner cutout -->
  <ellipse cx="63" cy="32" rx="9.5" ry="5"
    transform="rotate(30 63 32)" fill="#059669"/>
</svg>
